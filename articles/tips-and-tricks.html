<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tips & Tricks - Dynawiki</title>
    
    <link rel="stylesheet" href="../style.css">
    
    <style>
        /* --- Box Sizing Reset --- */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        /* --- Hero Header Section --- */
        .hero {
            height: 30vh;
            min-height: 200px;
            background-color: #8c32d2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            color: #fff;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        /* --- Content Section --- */
        .content-section {
            padding: 4rem 10%;
        }

        .section-title {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 3rem;
            color: #222;
        }

        /* --- Grid Layout --- */
        .tips-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .tip-card {
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .tip-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .tip-card-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #e0e0e0;
            border-bottom: 1px solid #eee;
        }

        .tip-card-title {
            padding: 1.2rem 1rem;
            text-align: center;
            font-size: 1.25rem;
            color: #111;
            margin: 0;
            background-color: #fff;
        }

        /* --- Modal Backdrop & Window --- */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-container {
            background: #ffffff;
            border-radius: 12px;
            width: 90%;
            max-width: 950px;
            padding: 2.5rem;
            position: relative;
            transform: scale(0.85);
            transition: transform 0.3s ease;
            box-shadow: 0 12px 32px rgba(0,0,0,0.3);
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-backdrop.active .modal-container {
            transform: scale(1);
        }

        .modal-close-btn {
            position: absolute;
            top: 1rem;
            right: 1.2rem;
            background: none;
            border: none;
            font-size: 2.5rem;
            cursor: pointer;
            color: #888;
            line-height: 1;
            transition: color 0.2s ease;
            z-index: 10;
        }

        .modal-close-btn:hover {
            color: #111;
        }

        .modal-title {
            font-size: 2rem;
            color: #222;
            margin-bottom: 0.25rem;
            text-align: center;
        }
        
        .modal-subtitle {
            text-align: center; 
            color: #666; 
            margin-bottom: 2rem;
            font-size: 1.1rem;
            transition: opacity 0.3s ease;
        }

        .modal-subtitle.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* --- Inner Modal Layout --- */
        .modal-body {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            flex: 1;
            min-height: 0;
            transition: all 0.4s ease;
        }

        /* --- Buttons Menu (Centered by Default with Larger Sizing) --- */
        .tactics-toggle {
            display: flex;
            flex-direction: row; 
            gap: 2rem;
            flex-shrink: 0;
            justify-content: center;
            align-items: center;
            padding: 1rem 0;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* When an option is clicked, shift to left vertically */
        .tactics-toggle.shifted {
            flex-direction: column;
            gap: 1rem;
            padding: 0;
        }

        /* LARGER INITIAL BUTTON SIZE */
        .tactic-btn {
            width: 260px;
            height: 260px;
            border: 4px solid transparent;
            font-size: 1.6rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 16px;
            transition: all 0.3s ease;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        /* Button Colors */
        #btn-offense { background-color: #d9534f; }
        #btn-defense { background-color: #0275d8; }
        #btn-survival { background-color: #5cb85c; }

        .tactic-btn:hover {
            transform: translateY(-6px) scale(1.03);
            box-shadow: 0 12px 25px rgba(0,0,0,0.2);
        }

        /* SHRUNK SIZE WHEN SHIFTED TO LEFT PANEL */
        .tactics-toggle.shifted .tactic-btn {
            width: 110px;
            height: 110px;
            font-size: 1.05rem;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .tactics-toggle.shifted .tactic-btn:hover {
            transform: translateY(-2px);
        }

        /* Active States */
        .tactic-btn.active-offense {
            border-color: #ffb3b3;
            box-shadow: 0 0 20px rgba(217, 83, 79, 0.6);
        }
        .tactic-btn.active-defense {
            border-color: #b3d9ff;
            box-shadow: 0 0 20px rgba(2, 117, 216, 0.6);
        }
        .tactic-btn.active-survival {
            border-color: #c2f0c2;
            box-shadow: 0 0 20px rgba(92, 184, 92, 0.6);
        }

        /* --- Expandable Right Panel Container --- */
        .expandable-panel {
            flex: 1;
            max-width: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.3s ease, margin-left 0.3s ease;
            display: flex;
            flex-direction: column;
            min-height: 0;
            height: 420px;
            margin-left: 0;
        }

        .expandable-panel.expanded {
            max-width: 100%;
            opacity: 1;
            margin-left: 1.5rem;
        }

        /* Scrollable Container Inside Panel */
        .panel-content-scroll {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 8px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            width: 100%;
            min-width: 0;
        }

        /* --- Dynamic Section Elements --- */
        .top-highlights-box {
            background: #f1f3f5;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1.2rem;
            flex-wrap: wrap;
            width: 100%;
        }

        .circle-placeholder {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            background-color: #ccc;
            flex-shrink: 0;
        }

        .section-box {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            width: 100%;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .square-thumbnail {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            background-color: #ddd;
            flex-shrink: 0;
            border: 1px solid #ccc;
        }

        .section-title-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: #222;
            margin: 0;
            word-break: break-word;
        }

        .section-body-text {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #444;
            margin: 0;
            word-break: break-word;
        }

        /* Scrollbar */
        .panel-content-scroll::-webkit-scrollbar { width: 6px; }
        .panel-content-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .panel-content-scroll::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        .panel-content-scroll::-webkit-scrollbar-thumb:hover { background: #aaa; }

        /* --- Responsive Layout --- */
        @media (max-width: 992px) {
            .tips-grid { grid-template-columns: repeat(2, 1fr); }
            .tactic-btn { width: 140px; height: 140px; font-size: 1.3rem; }
        }

        @media (max-width: 768px) {
            .tips-grid { grid-template-columns: 1fr; }
            .modal-body { flex-direction: column; }
            .tactics-toggle {
                flex-direction: row;
                width: 100%;
                gap: 1rem;
                justify-content: center;
            }
            .tactics-toggle.shifted {
                flex-direction: row;
                gap: 0.5rem;
            }
            .tactic-btn { width: 100px; height: 100px; font-size: 1rem; }
            .tactics-toggle.shifted .tactic-btn { width: 85px; height: 85px; font-size: 0.85rem; }
            .expandable-panel {
                max-height: 0;
                max-width: 100%;
                height: 320px;
                transition: max-height 0.4s ease, opacity 0.3s ease;
            }
            .expandable-panel.expanded {
                max-height: 350px;
                margin-left: 0;
                margin-top: 0.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="page-overlay" id="page-overlay"></div>

    <!-- Navigation -->
    <nav class="navbar minecraft-five">
        <button class="hamburger-btn" id="menu-toggle" aria-label="Toggle navigation">
            <span></span><span></span><span></span>
        </button>
        <h2>Dynawiki</h2>
        <div class="spacer"></div>
    </nav>

    <div class="dropdown-menu minecraft-five" id="dropdown-menu">
        <a href="../index.html">Home</a>
        <a href="../community.html">Community</a>
        <a href="../statistics.html">Statistics</a>
        <a href="../about-us.html">About Us</a>
        <a href="https://mccisland.net" target="_blank">MCC Island</a>
    </div>

    <header class="hero minecraft-ten">
        <h1>Tips & Tricks</h1>
        <p class="minecraft-five">Master tactics, launching strategies, and field defense</p>
    </header>

    <section class="content-section bg-white minecraft-ten">
        <h2 class="section-title">Tactical Guides</h2>
        
        <div class="tips-grid">

            <!-- CARD ITEM: ARMADA -->
            <div class="tip-card" 
                 data-title="Armada"
                 data-offense='{
                    "highlights": [
                        "../resources/image/section1.png",
                        "../resources/image/section2.png",
                        "../resources/image/section3.png"
                    ],
                    "sections": [
                        {
                            "thumb": "../resources/image/tnt.png",
                            "title": "Levi Block Destruction",
                            "text": "The first thing you do when you get TNT is to eliminate the levi block as much as you can. Sticking a player in the middle of the map makes them much more vulnerable."
                        },
                        {
                            "thumb": "../resources/image/section1.png",
                            "title": "Airstrike Tactics",
                            "text": "Charging an airstrike into the middle of the map works extremely well to disrupt clumped defenders."
                        },
                        {
                            "thumb": "../resources/image/section2.png",
                            "title": "Spawner o Skeleton",
                            "text": "Spawners contribute well in terrain destruction. Landing the spawner into the bottom of the boat is a highly difficult technique, yet gives opponents a massive disadvantage."
                        }
                    ]
                 }'
                 data-defense='{
                    "highlights": [
                        "../resources/image/section3.png",
                        "../resources/image/tnt.png",
                        "../resources/image/section1.png"
                    ],
                    "sections": [
                        {
                            "thumb": "../resources/image/section3.png",
                            "title": "Sloped Barriers",
                            "text": "Build inclined block slopes facing the enemy. When TNT lands on sloped structures, it bounces down into the void rather than exploding on your footing."
                        },
                        {
                            "thumb": "../resources/image/section2.png",
                            "title": "Frontline Defense",
                            "text": "This angled defense negates splash damage entirely if constructed flawlessly across your entire frontal line."
                        }
                    ]
                 }'
                 data-survival='{
                    "highlights": [
                        "../resources/image/tnt.png",
                        "../resources/image/section2.png"
                    ],
                    "sections": [
                        {
                            "thumb": "../resources/image/section1.png",
                            "title": "Void Recovery",
                            "text": "Always save a grapple or high-momentum gadget to save yourself if the platform beneath you gets destroyed."
                        },
                        {
                            "thumb": "../resources/image/section3.png",
                            "title": "Overtime Movement",
                            "text": "Keep moving between valid blocks during overtime shrinking. Standing still makes you an easy target for splash damage."
                        }
                    ]
                 }'>
                <img src="../resources/image/articles/tips-and-tricks/map/Armada.png" alt="Armada" class="tip-card-img">
                <h3 class="tip-card-title minecraft-ten">Armada</h3>
            </div>

        </div>
    </section>

    <!-- Pop-up Modal -->
    <div class="modal-backdrop" id="modal-backdrop">
        <div class="modal-container">
            <button class="modal-close-btn" id="modal-close">&times;</button>
            <h2 class="modal-title minecraft-ten" id="modal-title">Tip Title</h2>
            <p class="modal-subtitle minecraft-five" id="modal-subtitle">Select a strategy mode below:</p>

            <div class="modal-body" id="modal-body">
                
                <!-- 3 Options (Centered by default, shifts left on click) -->
                <div class="tactics-toggle minecraft-five" id="tactics-toggle">
                    <button class="tactic-btn minecraft-ten" id="btn-offense">Offense</button>
                    <button class="tactic-btn minecraft-ten" id="btn-defense">Defense</button>
                    <button class="tactic-btn minecraft-ten" id="btn-survival">Survival</button>
                </div>

                <!-- Flexible Container Right -->
                <div class="expandable-panel" id="expandable-panel">
                    <div class="panel-content-scroll minecraft-five" id="panel-text">
                        <!-- Dynamic Containers rendered by JS -->
                    </div>
                </div>
                
            </div>

        </div>
    </div>

    <footer class="footer minecraft-five">
        <p>A fanmade website for fun. &copy; 2026 by GeeTee_forSaken</p>
    </footer>

    <script>
        // --- Navigation Script ---
        const menuToggle = document.getElementById('menu-toggle');
        const dropdownMenu = document.getElementById('dropdown-menu');
        const pageOverlay = document.getElementById('page-overlay');

        function toggleMenu() {
            dropdownMenu.classList.toggle('active');
            pageOverlay.classList.toggle('active');
        }

        menuToggle.addEventListener('click', toggleMenu);
        pageOverlay.addEventListener('click', toggleMenu);

        // --- Modal Script ---
        const modalBackdrop = document.getElementById('modal-backdrop');
        const modalClose = document.getElementById('modal-close');
        const modalTitle = document.getElementById('modal-title');
        const modalSubtitle = document.getElementById('modal-subtitle');
        
        const tacticsToggle = document.getElementById('tactics-toggle');
        const btnOffense = document.getElementById('btn-offense');
        const btnDefense = document.getElementById('btn-defense');
        const btnSurvival = document.getElementById('btn-survival');
        
        const expandablePanel = document.getElementById('expandable-panel');
        const panelText = document.getElementById('panel-text');

        let currentOffenseData = null;
        let currentDefenseData = null;
        let currentSurvivalData = null;

        // Open Modal
        document.querySelectorAll('.tip-card').forEach(card => {
            card.addEventListener('click', () => {
                const title = card.getAttribute('data-title');
                
                // Parse JSON Data
                currentOffenseData = JSON.parse(card.getAttribute('data-offense') || 'null');
                currentDefenseData = JSON.parse(card.getAttribute('data-defense') || 'null');
                currentSurvivalData = JSON.parse(card.getAttribute('data-survival') || 'null');

                modalTitle.textContent = title;
                resetTactics();
                modalBackdrop.classList.add('active');
            });
        });

        // Close Modal
        function closeModal() {
            modalBackdrop.classList.remove('active');
            resetTactics();
        }

        modalClose.addEventListener('click', closeModal);
        modalBackdrop.addEventListener('click', (e) => {
            if (e.target === modalBackdrop) closeModal();
        });

        // Reset state back to initial centered layout
        function resetTactics() {
            btnOffense.classList.remove('active-offense');
            btnDefense.classList.remove('active-defense');
            btnSurvival.classList.remove('active-survival');
            
            tacticsToggle.classList.remove('shifted');
            expandablePanel.classList.remove('expanded');
            modalSubtitle.classList.remove('hidden');
        }

        // Render function for building structured elements
        function renderStrategyContent(data) {
            panelText.innerHTML = ''; 

            if (!data) return;

            // 1. Render Top Highlights Row (Circle Images)
            if (data.highlights && data.highlights.length > 0) {
                const highlightsBox = document.createElement('div');
                highlightsBox.className = 'top-highlights-box';

                data.highlights.forEach(imgSrc => {
                    const img = document.createElement('img');
                    img.src = imgSrc;
                    img.alt = "Highlight Icon";
                    img.className = 'circle-placeholder';
                    highlightsBox.appendChild(img);
                });

                panelText.appendChild(highlightsBox);
            }

            // 2. Render Section Boxes
            if (data.sections && data.sections.length > 0) {
                data.sections.forEach(sec => {
                    const secBox = document.createElement('div');
                    secBox.className = 'section-box';

                    secBox.innerHTML = `
                        <div class="section-header">
                            <img src="${sec.thumb}" alt="${sec.title}" class="square-thumbnail">
                            <h4 class="section-title-text minecraft-ten">${sec.title}</h4>
                        </div>
                        <p class="section-body-text minecraft-five">${sec.text}</p>
                    `;

                    panelText.appendChild(secBox);
                });
            }
        }

        // Select Tactic Helper
        function selectTactic(btn, activeClass, data) {
            btnOffense.classList.remove('active-offense');
            btnDefense.classList.remove('active-defense');
            btnSurvival.classList.remove('active-survival');

            btn.classList.add(activeClass);
            
            // Shift toggle container to left & reveal content
            tacticsToggle.classList.add('shifted');
            modalSubtitle.classList.add('hidden');
            renderStrategyContent(data);
            expandablePanel.classList.add('expanded');
        }

        // Option Button Clicks
        btnOffense.addEventListener('click', () => selectTactic(btnOffense, 'active-offense', currentOffenseData));
        btnDefense.addEventListener('click', () => selectTactic(btnDefense, 'active-defense', currentDefenseData));
        btnSurvival.addEventListener('click', () => selectTactic(btnSurvival, 'active-survival', currentSurvivalData));
    </script>
</body>
</html>
