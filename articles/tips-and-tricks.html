<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tips & Tricks - Dynawiki</title>
    
    <!-- Updated path to match your root directory -->
    <link rel="stylesheet" href="../style.css">
    
    <style>
        /* --- Box Sizing Reset --- */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        /* --- Hero Header Section --- */
        .hero {
            height: 30vh;
            min-height: 200px;
            background-color: #8c32d2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            color: #fff;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        /* --- Content Section --- */
        .content-section {
            padding: 4rem 10%;
        }

        .section-title {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 3rem;
            color: #222;
        }

        /* --- Grid Layout --- */
        .tips-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- Clickable Navigation Cards --- */
        .tip-card {
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            text-decoration: none; /* Removes underline from links */
            color: inherit; /* Keeps text color normal */
        }

        .tip-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .tip-card-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #e0e0e0;
            border-bottom: 1px solid #eee;
        }

        .tip-card-title {
            padding: 1.2rem 1rem;
            text-align: center;
            font-size: 1.25rem;
            color: #111;
            margin: 0;
            background-color: #fff;
        }

        /* --- Responsive Layout --- */
        @media (max-width: 992px) {
            .tips-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            .tips-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="page-overlay" id="page-overlay"></div>

    <!-- Navigation -->
    <nav class="navbar minecraft-five">
        <button class="hamburger-btn" id="menu-toggle" aria-label="Toggle navigation">
            <span></span><span></span><span></span>
        </button>
        <h2>Dynawiki</h2>
        <div class="spacer"></div>
    </nav>

    <div class="dropdown-menu minecraft-five" id="dropdown-menu">
        <a href="../index.html">Home</a>
        <a href="../community.html">Community</a>
        <a href="../statistics.html">Statistics</a>
        <a href="../about-us.html">About Us</a>
        <a href="https://mccisland.net" target="_blank">MCC Island</a>
    </div>

    <header class="hero minecraft-ten">
        <h1>Tips & Tricks</h1>
        <p class="minecraft-five">Master tactics, launching strategies, and field defense</p>
    </header>

    <section class="content-section bg-white minecraft-ten">
        <h2 class="section-title">Categories</h2>
        
        <div class="tips-grid">

            <!-- Clickable Card: Maps -->
            <a href="tips-and-tricks/maps.html" class="tip-card">
                <!-- Replace src with an actual thumbnail image for the Maps category -->
                <img src="../resources/image/articles/tips-and-tricks/thumbnail-map.png" alt="Maps Guide" class="tip-card-img">
                <h3 class="tip-card-title minecraft-ten">Maps</h3>
            </a>

            <!-- Clickable Card: Lores -->
            <a href="tips-and-tricks/items.html" class="tip-card">
                <!-- Replace src with an actual thumbnail image for the Lores category -->
                <img src="../resources/image/articles/tips-and-tricks/thumbnail-item.png" alt="Items Guide" class="tip-card-img">
                <h3 class="tip-card-title minecraft-ten">Items</h3>
            </a>
            
            <!-- You can easily copy/paste the <a> block above to add more categories! -->

        </div>
    </section>

    <footer class="footer minecraft-five">
        <p>A fanmade website for fun. &copy; 2026 by GeeTee_forSaken</p>
    </footer>

    <script>
        // --- Navigation Script (Modal script has been completely removed) ---
        const menuToggle = document.getElementById('menu-toggle');
        const dropdownMenu = document.getElementById('dropdown-menu');
        const pageOverlay = document.getElementById('page-overlay');

        function toggleMenu() {
            dropdownMenu.classList.toggle('active');
            pageOverlay.classList.toggle('active');
        }

        menuToggle.addEventListener('click', toggleMenu);
        pageOverlay.addEventListener('click', toggleMenu);
    </script>
</body>
</html>
